<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>Atlas GPU check</title>
<link rel="icon" href="data:,">
<pre id="result">Checking…</pre>
<script type="module">
import { CanvasTexture, NearestFilter, NearestMipmapLinearFilter, Scene, PerspectiveCamera, OrthographicCamera, WebGLRenderer, WebGLRenderTarget } from 'three';
import { AssetManager } from '/src/core/AssetManager.ts';
import { appendElement, emptyMesh } from '/src/minecraft/Mesher.ts';

// Render blue tiles surrounded by red. A single red pixel exposes wrong-row sampling.
try {
  const assets=await AssetManager.load(),{size,cell}=assets.manifest.atlas,columns=size/cell;
  const image=document.createElement('canvas');image.width=image.height=size;
  const paint=image.getContext('2d'),texture=new CanvasTexture(image);
  texture.magFilter=NearestFilter;texture.minFilter=NearestMipmapLinearFilter;
  const original=assets.opaque.map;assets.opaque.map=texture;
  const tile=assets.manifest.atlas.tiles.findIndex(t=>t.frames===1);
  if(tile<0)throw Error('Static atlas tile missing');
  const data=emptyMesh();
  appendElement(data,{from:[0,0,1],to:[5,4,1],faces:{south:{tile,uv:[0,0,80,64]}}},[0,0,0],{rotation:[0,0,0],emissive:1,tint:[1,1,1]});
  const mesh=assets.mesh(data),info=mesh.geometry.getAttribute('tileInfo'),scene=new Scene();scene.add(mesh);
  const renderer=new WebGLRenderer({antialias:false}),target=new WebGLRenderTarget(960,720),pixels=new Uint8Array(960*720*4);
  const camera=new PerspectiveCamera(70,960/720,.05,100);renderer.setRenderTarget(target);
  let checks=0;
  for(const start of [1023,1024,1025])for(const frames of [1,3]) {
    paint.fillStyle='red';paint.fillRect(0,0,size,size);paint.fillStyle='blue';
    for(let frame=0;frame<frames;frame++)paint.fillRect((start+frame)%columns*cell,Math.floor((start+frame)/columns)*cell,cell,cell);
    texture.needsUpdate=true;
    for(let i=0;i<info.count;i++)info.setXYZ(i,start,frames,1);info.needsUpdate=true;
    for(const time of [0,10.15])for(const distance of [1.5,15]) {
      assets.time.value=time;camera.position.set(1.5,1.5,distance);camera.lookAt(2.5,1.5,1);
      renderer.render(scene,camera);renderer.readRenderTargetPixels(target,0,0,960,720,pixels);
      let blue=0,red=0;for(let i=0;i<pixels.length;i+=4){if(pixels[i]>0)red++;if(pixels[i+2]>0)blue++;}
      if(red||blue<100)throw Error(`Wrong tile: start=${start}, frames=${frames}, time=${time}, distance=${distance}, red=${red}, blue=${blue}`);
      checks++;
    }
  }
  // Readback is linear: native display-space red 0.3 at full light must be ~18/255,
  // rather than 76/255 from applying the tint directly to a linear texture.
  paint.fillStyle='white';paint.fillRect(0,0,size,size);texture.needsUpdate=true;
  const colors=mesh.geometry.getAttribute('color'),light=mesh.geometry.getAttribute('lightLevel'),glow=mesh.geometry.getAttribute('glow');
  for(let i=0;i<colors.count;i++)colors.setXYZ(i,.3,0,0);colors.needsUpdate=true;assets.gamma.value=0;
  camera.position.set(1.5,1.5,3);camera.lookAt(2.5,1.5,1);renderer.render(scene,camera);renderer.readRenderTargetPixels(target,0,0,960,720,pixels);
  let red=0;for(let i=0;i<pixels.length;i+=4)red=Math.max(red,pixels[i]);
  if(red<17||red>19)throw Error(`Incorrect tint/color space: ${red}`);checks++;
  for(let i=0;i<colors.count;i++){colors.setXYZ(i,1,1,1);glow.setX(i,0);}colors.needsUpdate=glow.needsUpdate=true;
  function brightness(day,gamma,sky,torch) {
    assets.daylight.value=day;assets.gamma.value=gamma;
    for(let i=0;i<light.count;i++)light.setXY(i,sky,torch);light.needsUpdate=true;
    renderer.render(scene,camera);renderer.readRenderTargetPixels(target,0,0,960,720,pixels);
    const rgb=[0,0,0];for(let i=0;i<pixels.length;i+=4)for(let channel=0;channel<3;channel++)rgb[channel]=Math.max(rgb[channel],pixels[i+channel]);checks++;return rgb;
  }
  const cave=brightness(.08,0,0,0),bright=brightness(.08,1,0,0),day=brightness(1,0,1,0),night=brightness(.08,0,1,0),torch=brightness(.08,0,0,7/15);
  if(!(bright[0]>cave[0]&&day[2]>night[2]&&torch[0]>torch[1]&&torch[1]>torch[2]))throw Error(`Incorrect Gamma/sky/torch light: ${JSON.stringify({cave,bright,day,night,torch})}`);
  // A native 14×10 chest face must render fourteen equal columns and ten equal rows.
  const entry=assets.manifest.atlas.tiles[tile],oldSize=entry.size;entry.size=[28,30];
  const chestData=emptyMesh();appendElement(chestData,{from:[0,0,1],to:[14,10,1],faces:{south:{tile,uv:[0,0,16,16]}}},[0,0,0],{rotation:[0,0,0],emissive:1,tint:[1,1,1]});chestData.color.fill(1);
  const chest=assets.mesh(chestData);entry.size=oldSize;scene.remove(mesh);scene.add(chest);
  paint.fillStyle='lime';paint.fillRect(0,0,size,size);
  for(let y=0;y<10;y++)for(let x=0;x<14;x++){
    paint.fillStyle=(x+y)%2?'blue':'red';paint.fillRect(entry.start%columns*cell+18+x*2,Math.floor(entry.start/columns)*cell+17+y*3,2,3);
  }
  texture.needsUpdate=true;assets.time.value=0;
  const ortho=new OrthographicCamera(0,14,10,0,.1,10);ortho.position.z=3;
  renderer.render(scene,ortho);renderer.readRenderTargetPixels(target,0,0,960,720,pixels);
  for(let y=0;y<720;y++)for(let x=0;x<960;x++){
    const u=x*14/960,v=y*10/720;if(Math.abs(u-Math.round(u))<14/960||Math.abs(v-Math.round(v))<10/720)continue;
    const channel=(Math.floor(u)+9-Math.floor(v))%2?2:0,i=(y*960+x)*4;
    if(pixels[i+channel]<245||pixels[i+1]>0)throw Error(`Uneven chest texel at ${x},${y}: ${pixels.slice(i,i+3)}`);
  }
  checks++;chest.geometry.dispose();
  // Native liquid frames must hold for their complete .mcmeta duration on the GPU.
  scene.remove(chest);scene.add(mesh);assets.opaque.map=original;
  for(let i=0;i<colors.count;i++){colors.setXYZ(i,1,1,1);glow.setX(i,1);}colors.needsUpdate=glow.needsUpdate=true;
  for(const theme of ['vanilla','mario','festive','halloween','chinese'])for(const kind of ['water','lava']){
    const block=assets.manifest.blocks.find(b=>b?.theme===theme&&b.name===kind&&b.fluidLevel===0);
    for(const id of block.fluidTiles.slice(0,2)){
      const entry=assets.manifest.atlas.tiles[id],period=entry.ticks/20;
      for(let i=0;i<info.count;i++)info.setXYZ(i,entry.start,entry.frames,entry.ticks);info.needsUpdate=true;
      assets.time.value=0;renderer.render(scene,camera);renderer.readRenderTargetPixels(target,0,0,960,720,pixels);const first=pixels.slice();
      assets.time.value=period-.0001;renderer.render(scene,camera);renderer.readRenderTargetPixels(target,0,0,960,720,pixels);
      if(!pixels.every((n,i)=>n===first[i]))throw Error(`Liquid frame changed too early: ${theme} ${kind} tile ${id}`);checks++;
      assets.time.value=period+.0001;renderer.render(scene,camera);renderer.readRenderTargetPixels(target,0,0,960,720,pixels);
      if(pixels.every((n,i)=>n===first[i]))throw Error(`Liquid animation did not advance: ${theme} ${kind} tile ${id}`);checks++;
    }
  }
  mesh.geometry.dispose();texture.dispose();original.dispose();target.dispose();renderer.dispose();
  document.querySelector('#result').textContent=`PASS: ${checks} GPU checks (atlas, native liquid timing, chest texel spacing, native tint, Gamma, day/night and warm torch light)`;
} catch(error) {
  document.querySelector('#result').textContent=`FAIL: ${error.message}`;
  throw error;
}
</script>
</html>
