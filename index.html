<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#262626" />
  <meta name="description" content="Import and explore Minecraft worlds with their resource packs in your browser." />
  <title>Minecraft World Viewer</title>
  <link rel="canonical" href="https://mcv.riyo.me/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Minecraft World Viewer" />
  <meta property="og:title" content="Minecraft World Viewer" />
  <meta property="og:description" content="Import and explore Minecraft worlds with their resource packs in your browser." />
  <meta property="og:url" content="https://mcv.riyo.me/" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:image" content="https://mcv.riyo.me/og-image.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1659" />
  <meta property="og:image:height" content="802" />
  <meta property="og:image:alt" content="Minecraft World Viewer Home screen with the logo and world selection menu." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Minecraft World Viewer" />
  <meta name="twitter:description" content="Import and explore Minecraft worlds with their resource packs in your browser." />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>
<body>
  <canvas id="world" tabindex="-1" aria-label="3D World"></canvas>
  <div id="menus"><p>Loading assets...</p></div>
  <div id="hud" hidden aria-hidden="true"><div class="crosshair"></div><div id="hotbar"></div><div id="debug" hidden></div><div id="water-overlay"></div></div>
  <div id="inventory-screen" hidden>
    <section id="inventory-panel" role="dialog" aria-modal="true" aria-label="Inventory">
      <span class="inventory-title">Search Items</span><input id="item-search" aria-label="Search Items" autocomplete="off" spellcheck="false" />
      <div id="inventory-scroll" role="scrollbar" aria-label="Items" aria-valuemin="0" aria-valuenow="0" aria-orientation="vertical"></div>
    </section>
    <div id="item-tooltip" hidden></div><div id="item-cursor" hidden></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
